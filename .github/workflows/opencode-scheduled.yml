name: OpenCode Scheduled
on:
  schedule:
    - cron: '0 9 * * 1'

jobs:
  maintenance:
    permissions:
      id-token: 'write'      # Required for Google Cloud handshake
      contents: 'write'      # Required to push code/branches
      pull-requests: 'write' # Required to open/comment on PRs
      issues: 'write'        # Required to comment on issues
    runs-on: ubuntu-latest
    
    # GLOBAL JOB ENV: Inherited by all steps below
    env:
          GOOGLE_CLOUD_PROJECT: 'maropost1984'
          GOOGLE_CLOUD_LOCATION: 'us-central1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
          GIT_COMMITTER_NAME: 'github-actions[bot]'
          GIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full history so AI can find "stale" debt
          
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/527057980290/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'gemini-app-sa-maropost-tes-198@maropost1984.iam.gserviceaccount.com'

                
      - name: Configure Git Identity
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      # STEP 1: AI Maintenance Scan
      - name: Run OpenCode Agent
        uses: anomalyco/opencode/github@latest
        with:
          model: 'google-vertex/gemini-2.5-flash'
          # ADD THIS LINE to prevent branch creation:
          agent: 'plan'
          use_github_token: true
          prompt: |
              1. Scan the repository for TODOs and present them as a Checkbox list.
              2. Identify any open issues that haven't had activity in 30 days.
              3. Post a summary as a new issue titled 'Weekly Tech Debt Report'.
              4. Organize the report by 'Priority' (Critical, Minor, Cleanup).
              
      # STEP 2: Automated Branch Cleanup (Value Add)
      - name: Cleanup Merged OpenCode Branches
        run: |
          echo "Pruning remote branches..."
          git remote prune origin
          
          # Finds remote branches starting with 'opencode/' that are already merged into main
          MERGED_BRANCHES=$(git branch -r --merged origin/main | grep 'origin/opencode/' | sed 's/origin\///')
          
          if [ -z "$MERGED_BRANCHES" ]; then
            echo "No merged OpenCode branches to clean."
          else
            for branch in $MERGED_BRANCHES; do
              echo "Deleting $branch..."
              git push origin --delete $branch
            done
          fi
        
