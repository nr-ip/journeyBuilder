name: OpenCodeFix
on:
  issue_comment:
    types: [created]
  # Enables triggering this from your local OpenCode chat window
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'The issue number to fix'
        required: true
        type: string
      command:
        description: 'The command (e.g., /ocFix fix)'
        required: true
        default: '/ocFix fix'

# Prevent multiple builds on the same issue/PR simultaneously
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false # Set to false for commands to avoid killing a running build
  
jobs:
  execute:
    if: |
          github.event_name == 'workflow_dispatch' || 
          (github.event.issue.pull_request == null && 
          (contains(github.event.comment.body, '/opencodeFix') || 
          startsWith(github.event.comment.body, '/ocFix')) &&
          github.event.comment.user.type != 'Bot')
      
    permissions:
      id-token: 'write'      # Required for Google Cloud handshake
      contents: 'write'      # Required to push code/branches
      pull-requests: 'write' # Required to open/comment on PRs
      issues: 'write'        # Required to comment on issues
    runs-on: ubuntu-latest

    env:
        GOOGLE_CLOUD_PROJECT: 'maropost1984'
        GOOGLE_CLOUD_LOCATION: 'us-central1'
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GIT_AUTHOR_NAME: 'github-actions[bot]'
        GIT_AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
        GIT_COMMITTER_NAME: 'github-actions[bot]'
        GIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authenticate to Google Cloud 
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/527057980290/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'gemini-app-sa-maropost-tes-198@maropost1984.iam.gserviceaccount.com'
          
      - name: Configure Git Identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Fetch Issue Context
        id: fetch_context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use either the manual input or the event issue number
          ISSUE_NUM: ${{ github.event.inputs.issue_number || github.event.issue.number }}
        run: |
          # Fetch the original issue body (Triage output is usually here or in a comment)
          ISSUE_BODY=$(gh issue view ${{ github.event.issue.number }} --json body --jq '.body')
          
          # Fetch the last 5 comments to get the "Triage Agent" output and user discussion
          COMMENTS=$(gh issue view ${{ github.event.issue.number }} --json comments --jq '.comments[-5:] | map(.body) | join("\n---\n")')
          
          # Store them as multiline outputs for the next step
          {
            echo "issue_context<<'EOF'"
            echo "$ISSUE_BODY"
            echo "'EOF'"
            echo "comment_context<<'EOF'"
            echo "$COMMENTS"
            echo "'EOF'"
          } >> "$GITHUB_OUTPUT"
      

      - name: Run OpenCode Agent
        uses: anomalyco/opencode/github@latest
        with:
          model: 'google-vertex/gemini-2.5-pro' # Upgrade to Pro for actual coding
          # DYNAMIC AGENT MODE:
          ## Switch mode based on the keyword used in your comment
          # /oc-fix fix -> editor | /oc-fix plan -> plan | /oc-fix review -> review
          agent: >
            ${{ contains(github.event.inputs.command || github.event.comment.body, 'fix') && 'editor' ||
                contains(github.event.inputs.command || github.event.comment.body, 'plan') && 'plan' || 
                contains(github.event.inputs.command || github.event.comment.body, 'review') && 'review' }}
          use_github_token: true
          branch_name: 'opencode/fix-issue-${{ github.event.inputs.issue_number || github.event.issue.number }}'
          # Value Add: Pass the actual user comment as the specific instruction
          share: true
          create_pull_request: true # Automatically open PR for your review.
          prompt: |
            # CORE INSTRUCTION
            User Command: "${{ github.event.comment.body }}"
            
            # PREVIOUS CONTEXT (Triage & Comments)
            Original Issue:
            ${{ steps.fetch_context.outputs.issue_context }}
            
            Recent Discussion & Triage Analysis:
            ${{ steps.fetch_context.outputs.comment_context }}
            
            Context: Resolve the parent issue using the instructions provided in the command.
            
            Instruction: Analyze the issue context.
            Resolve the issue by combining the latest user command with the architectural plan provided in the Triage analysis above. 
            Strictly follow the Senior Engineer rules in AGENTS.md.

      - name: Update Issue Status
        if: success() # Only run if the AI successfully processed the command
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = "${{ github.event.inputs.issue_number || github.event.issue.number }}";
            
            // 1. Add the "in-progress" label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              labels: ['status: in-progress', 'agentic-fix']
            });

            // 2. Remove the "ready-for-dev" or "triage" labels if they exist
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                name: 'status: ready-for-dev'
              });
            } catch (e) {
              // Ignore error if the label wasn't there
            }

            // 3. Post a confirmation comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: `🚀 **OpenCode Agent is on it!** I've created a fix branch: \`opencode/fix-issue-${issue_number}\`. I'll update you once the code is ready for review.`
            });

