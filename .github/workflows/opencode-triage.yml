name: OpenCode Triage
on:
  issues:
    types: [opened] # This file strictly handles new issues and analyze the request

jobs:
  triage:
  # No 'if' check needed here since the 'on' trigger is already specific
  # CHANGE: Added check for 'magic strings' in the issue body, i.e. Issue description starts with:
    if: |
      startsWith(github.event.issue.body, '/opencode-analyze') || 
      startsWith(github.event.issue.body, '/analyze-issue') ||
      github.event.issue.author_association == 'OWNER' 
    
    #Only execute when issue are opened. Thus removed permissiones related to any other actions.   
    permissions:
      id-token: 'write'      # Required for Google Cloud handshake
      issues: 'write'        # Required to comment on issues
      
    runs-on: ubuntu-latest
    steps:
      # CHANGE 1: Explicitly point to the default branch (main) 
      # This fixes the "fatal: not a git repository" for 'opened' events
      - name: Checkout Code
        uses: actions/checkout@v5 # Upgraded to v5 for 2026 Node support
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/527057980290/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'gemini-app-sa-maropost-tes-198@maropost1984.iam.gserviceaccount.com'

                
      - name: Configure Git Identity
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Run OpenCode Agent
        uses: anomalyco/opencode/github@latest
        with:
          model: 'google-vertex/gemini-2.5-flash'
          # ADD THIS LINE to prevent branch creation:
          agent: 'plan'
          use_github_token: true
          prompt: "Analyze the repository context and this issue: ${{ github.event.issue.title }}. 
            Summarize this issue and suggest appropriate GitHub labels. Identify which files in are likely involved"
        env:
          GOOGLE_CLOUD_PROJECT: 'maropost1984'
          GOOGLE_CLOUD_LOCATION: 'us-central1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
          GIT_COMMITTER_NAME: 'github-actions[bot]'
          GIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
