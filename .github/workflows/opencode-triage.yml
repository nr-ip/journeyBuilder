name: OpenCode Triage
on:
  issues:
    types: [opened]
jobs:
  triage:
    permissions:
      id-token: 'write'
      issues: 'write'
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/527057980290/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'gemini-app-sa-maropost-tes-198@maropost1984.iam.gserviceaccount.com'
      - uses: anomalyco/opencode/github@latest
        with:
          model: 'google/gemini-2.5-flash'
          prompt: "Analyze this issue. Suggest labels and summarize the core problem."