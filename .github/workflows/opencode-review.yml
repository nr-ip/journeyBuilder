name: OpenCode Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    permissions:
      id-token: 'write'
      contents: 'read'
      pull-requests: 'write'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/527057980290/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'gemini-app-sa-maropost-tes-198@maropost1984.iam.gserviceaccount.com'
      - uses: anomalyco/opencode/github@latest
        with:
          model: 'google-vertex/gemini-1.5-pro-002'
          prompt: "Review this PR for security issues, logic flaws, and code style."
        env:
          GOOGLE_CLOUD_PROJECT: 'maropost1984'
          GOOGLE_CLOUD_LOCATION: 'us-central1'