name: OpenCodeReview
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created] # Allows triggering fixes via <see below>
  workflow_dispatch: # This allows the OpenCode agent to "see" the trigger
    inputs:
      pull_request_number:
        description: 'PR number to review'
        required: true
        type: string

# Prevent multiple AI runs on the same PR to save on GCP costs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # Default to read


jobs:
  review:
  # UPDATED IF: 
    # 1. Added check to ensure comments are only processed if they are on a Pull Request.
    # 2. Added check to ensure only repo Owners or Collaborators can trigger the AI.
    if: |
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'pull_request' ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
        (contains(github.event.comment.body, '/reviewPr') || 
          contains(github.event.comment.body, '/ocReviewPr'))
        )
      ) &&
        (github.event.comment == null || github.event.comment.user.type != 'Bot') &&
        (github.event.sender.role_name == 'admin' || github.event.sender.login == github.repository_owner 
        || github.event.comment.author_association == 'OWNER' || 
        github.event.comment.author_association == 'COLLABORATOR')
        
    permissions:
      id-token: 'write'      # Required for Google Cloud handshake
      contents: 'write'      # Required to push code/branches
      pull-requests: 'write' # Required to open/comment on PRs
      issues: 'write'        # Required to comment on issues
      
    runs-on: ubuntu-latest
    
    steps:
      - name: Dump GitHub Context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
     
      - name: Checkout Code
        uses: actions/checkout@v5 #Upgraded to V5 (2026) standard
        with:
          fetch-depth: 0 # AI need The entire history of all branches and tags for code analysis.

      - name: Switch to PR Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.inputs.pull_request_number || github.event.pull_request.number }}
        run: |
          echo "🎯 Setting context for PR #$PR_NUM"
          gh pr checkout "$PR_NUM"
          # This ensures the agent sees the UNMERGED changes
          git fetch origin ${{ github.event.pull_request.base.ref || 'master' }}
          
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/527057980290/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'gemini-app-sa-maropost-tes-198@maropost1984.iam.gserviceaccount.com'
                
      - name: Configure Git Identity
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Run OpenCode Agent
        uses: anomalyco/opencode/github@latest
        with:
          model: 'google-vertex/gemini-2.5-pro'
          # --obsolete -- ADD THIS LINE to prevent branch creation:
          # ONLY use 'editor' if the comment starts exactly with the fix command
          agent: 'review' # No longer switches to 'editor'
          ## >
          ## ${{ (github.event_name == 'issue_comment' && contains(github.event.comment.body, 'fix')) && 'editor' || 'review' }}
          use_github_token: true
          # ADD THIS LINE: This is the bridge the agent needs to "see" the PR
          ## pull_request_number: ${{ github.event.inputs.pull_request_number || github.event.pull_request.number }}
          prompt: |
            PR_NUMBER: ${{ github.event.inputs.pull_request_number || github.event.pull_request.number }}
            DIFF_CONTEXT: $(git diff origin/${{ github.event.pull_request.base.ref || 'master' }}...HEAD)
            
            Context: ${{ github.event.pull_request.title || 'Manual Review Request' }}
            User Instructions: ${{ github.event.comment.body || 'Perform a standard architectural and security review.' }}

            Scope Constraint:
            - Perform an INCREMENTAL review only.
            - Only analyze and comment on the specific changes provided in the Pull Request diff.
            - Ignore existing code patterns in the file that were not modified as part of this PR.

            Review Requirements:
            1. Security & Data Integrity: Identify OWASP vulnerabilities and race conditions.
            2. Logic & Edge Cases: Focus on boundary conditions and unexpected input types.
            3. Architectural Alignment: Ensure adherence to @docs/StyleGuide.md and @docs/Architecture.md(if exists)

            Executive Summary (Post as a top-level comment):
            - Risk Score: Assign a status of [🟢 LOW], [🟡 MEDIUM], or [🔴 HIGH] based on the severity of found issues.
            - Summary: A 2-sentence overview of the PR's architectural health.

            Strict Constraint: DO NOT create branches or push commits.
            Output Requirement: Use GitHub multi-line suggestion format (```suggestion) for actionable code changes.
            
        env:
          OPENCODE_REVIEW_MODE: 'true'
          OPENCODE_CREATE_PR: 'false'
          OPENCODE_PULL_REQUEST_NUMBER: "${{ github.event.inputs.pull_request_number || github.event.pull_request.number }}"
          GOOGLE_CLOUD_PROJECT: 'maropost1984'
          GOOGLE_CLOUD_LOCATION: 'us-central1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
          GIT_COMMITTER_NAME: 'github-actions[bot]'
          GIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
