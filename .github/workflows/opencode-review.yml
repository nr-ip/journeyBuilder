name: OpenCode Agentic Integration and Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created] # Allows triggering fixes via <see below>

# Prevent multiple AI runs on the same PR to save on GCP costs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # Default to read


jobs:
  review:
  # UPDATED IF: 
    # 1. Added check to ensure comments are only processed if they are on a Pull Request.
    # 2. Added check to ensure only repo Owners or Collaborators can trigger the AI.
    if: |
      (
        github.event_name == 'pull_request' ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
        (contains(github.event.comment.body, '/review-pr') || 
          contains(github.event.comment.body, '/review-pr'))
        )
      ) &&
        (github.event.comment == null || github.event.comment.user.type != 'Bot') &&
        (github.event.sender.role_name == 'admin' || github.event.sender.login == github.repository_owner 
        || github.event.comment.author_association == 'OWNER' || 
        github.event.comment.author_association == 'COLLABORATOR')
        
    permissions:
      id-token: 'write'      # Required for Google Cloud handshake
      contents: 'write'      # Required to push code/branches
      pull-requests: 'write' # Required to open/comment on PRs
      issues: 'write'        # Required to comment on issues
      
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5 #Upgraded to V5 (2026) standard
        with:
          fetch-depth: 2 # AI need full context to understand code
          
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/527057980290/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'gemini-app-sa-maropost-tes-198@maropost1984.iam.gserviceaccount.com'
                
      - name: Configure Git Identity
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Run OpenCode Agent
        uses: anomalyco/opencode/github@latest
        with:
          model: 'google-vertex/gemini-2.5-pro'
          # --obsolete -- ADD THIS LINE to prevent branch creation:
          # ONLY use 'editor' if the comment starts exactly with the fix command
          agent: >
            ${{ (github.event_name == 'issue_comment' && contains(github.event.comment.body, 'fix')) && 'editor' || 'review' }}
          use_github_token: true
          prompt: >
            ${{ (github.event_name == 'issue_comment' && github.event.comment.body) || 'Standard automated PR review request.' }}
            "Review this PR for
            1. Security issues, logic flaws, and code style.
            2. Logic flaws and edge cases
            3. Adherence to project @docs/StyleGuide.md(if exists)
            Provide specific code suggestions where possible
            "
        env:
          GOOGLE_CLOUD_PROJECT: 'maropost1984'
          GOOGLE_CLOUD_LOCATION: 'us-central1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
          GIT_COMMITTER_NAME: 'github-actions[bot]'
          GIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
