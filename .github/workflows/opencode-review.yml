name: OpenCode Review
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  review:
    permissions:
      id-token: 'write'
      contents: 'read'
      pull-requests: 'write'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/527057980290/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'gemini-app-sa-maropost-tes-198@maropost1984.iam.gserviceaccount.com'
      - uses: anomalyco/opencode/github@latest
        with:
          model: 'google/gemini-1.5-pro'
          prompt: "Review this PR for logic errors and security vulnerabilities."